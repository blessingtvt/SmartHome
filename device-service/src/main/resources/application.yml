server:
  port: 8083

spring:
  application:
    name: device-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        # 单机本地联调：强制注册 127.0.0.1，避免 Windows 多网卡误注册虚拟网卡 IP 导致网关 lb:// 路由失败
        ip: 127.0.0.1
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/smart_home_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: smart_home
    password: 123456

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，便于观察入库情况
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# 设备在线判定配置（S3）
smart-home:
  device:
    # 超过该秒数未收到心跳/数据则判为 OFFLINE
    offline-threshold-seconds: 90
    # 离线扫描任务间隔（毫秒）
    offline-scan-interval-ms: 30000
